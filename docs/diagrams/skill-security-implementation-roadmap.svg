<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1373.462 150.7" width="1373.462" height="150.7" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="185.69,75.35 233.69,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="406.056,75.35 454.056,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="641.242,75.35 689.242,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="863.0899999999999,75.35 911.0899999999999,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1113.096,75.35 1161.096,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="1  建立完整台账
新增用钩子触发
历史用全量扫描" data-shape="rectangle">
  <rect x="40" y="40" width="145.69" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="112.845" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="112.845" dy="-12.350000000000001">1  建立完整台账</tspan><tspan x="112.845" dy="16.900000000000002">新增用钩子触发</tspan><tspan x="112.845" dy="16.900000000000002">历史用全量扫描</tspan></text>
</g>
<g class="node" data-id="B" data-label="2  分析公司 Skill 现状
数量、归属、用途
问题和维护情况" data-shape="rectangle">
  <rect x="233.69" y="40" width="172.36599999999999" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="319.873" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="319.873" dy="-12.350000000000001">2  分析公司 Skill 现状</tspan><tspan x="319.873" dy="16.900000000000002">数量、归属、用途</tspan><tspan x="319.873" dy="16.900000000000002">问题和维护情况</tspan></text>
</g>
<g class="node" data-id="C" data-label="3  安全检查与统一评分
静态工具与 AI 并行
形成风险和整改建议" data-shape="rectangle">
  <rect x="454.056" y="40" width="187.18599999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="547.649" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="547.649" dy="-12.350000000000001">3  安全检查与统一评分</tspan><tspan x="547.649" dy="16.900000000000002">静态工具与 AI 并行</tspan><tspan x="547.649" dy="16.900000000000002">形成风险和整改建议</tspan></text>
</g>
<g class="node" data-id="D" data-label="4  搭建公司 SkillHub
评估讯飞 SkillHub
或 AI WorkForce 商城" data-shape="rectangle">
  <rect x="689.242" y="40" width="173.84799999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="776.1659999999999" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="776.1659999999999" dy="-12.350000000000001">4  搭建公司 SkillHub</tspan><tspan x="776.1659999999999" dy="16.900000000000002">评估讯飞 SkillHub</tspan><tspan x="776.1659999999999" dy="16.900000000000002">或 AI WorkForce 商城</tspan></text>
</g>
<g class="node" data-id="E" data-label="5  产品线确认并自行上传
平台只建私密候选
不得自动公开上架" data-shape="rectangle">
  <rect x="911.0899999999999" y="40" width="202.00599999999997" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1012.0929999999998" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1012.0929999999998" dy="-12.350000000000001">5  产品线确认并自行上传</tspan><tspan x="1012.0929999999998" dy="16.900000000000002">平台只建私密候选</tspan><tspan x="1012.0929999999998" dy="16.900000000000002">不得自动公开上架</tspan></text>
</g>
<g class="node" data-id="F" data-label="6  完善长期管理流程
上架、变更、审查
下架、退役和恢复" data-shape="rectangle">
  <rect x="1161.096" y="40" width="172.36599999999999" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1247.279" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1247.279" dy="-12.350000000000001">6  完善长期管理流程</tspan><tspan x="1247.279" dy="16.900000000000002">上架、变更、审查</tspan><tspan x="1247.279" dy="16.900000000000002">下架、退役和恢复</tspan></text>
</g>
</svg>