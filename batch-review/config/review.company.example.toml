# 公司环境待填写配置。不要提交真实内网地址、账号或凭据。

[batch]
inventory_csv = "../inventory/skill_summary.csv"
batch_id_prefix = "skill-review"
included_statuses = ["ACTIVE"]

[workspace]
# Runtime（临时，可由可信脚本受控清理）
root = "/data/skill-review/work"
git_download_root = "/data/skill-review/git_download"
# State（批次状态/index/queue；兼容键名仍为 manifest_root）
manifest_root = "/data/skill-review/manifests"
# Archive + Evidence（冻结包/持久结果 + 受限证据）
skills_root = "/data/skill-review/skills"
evidence_root = "/data/skill-review/restricted-evidence"
# Candidate staging（发布候选，不是审计证据）
candidate_root = "/data/skill-review/private-candidates"
# Reports（唯一人工入口：<batch-id>/skill-security-review-report.html）
results_root = "/data/skill-review/results"
clean_after_repository = true
keep_failed_workspace = false

[gerrit]
ssh_url_template = "ssh://{user}@{host}:{port}/{repo_name}.git"
user = "FILL_GERRIT_READONLY_USER"
host = "gerrit.example.com"
port = 29418
allowed_repositories = []

[status_mapping]
"新增" = "ACTIVE"
"修改" = "ACTIVE"
"删除" = "DELETED"

[quality]
candidate_threshold = 70
max_score = 100

[ai]
# Canonical policy / Schema；.claude/.codex 只做客户端适配。
skill_path = "../.agents/skills/skill-security-review"
result_schema_path = "../.agents/skills/skill-security-review/references/review-result.schema.json"

[scanners.cisco]
enabled = true
version = "2.0.13"
timeout_seconds = 600
command = [
  "/opt/skill-review/scanners/cisco/bin/skill-scanner",
  "scan", "{skill_root}",
  "--format", "json", "--compact", "--output", "{output_file}",
]

[scanners.skillspector]
enabled = true
version = "2.5.1"
timeout_seconds = 600
command = [
  "/opt/skill-review/scanners/skillspector/bin/skillspector",
  "scan", "{skill_root}",
  "--no-llm", "--format", "json", "--output", "{output_file}",
]

[retry]
max_attempts = 3
backoff_seconds = 5
max_backoff_seconds = 60

[concurrency]
repositories = 1
skills_per_repository = 1
ai_reviews = 5
