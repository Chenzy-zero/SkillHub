# This file is a local example. Replace the Gerrit values, lifecycle statuses,
# scanner versions and model identifier before any execution command uses it.

[batch]
inventory_csv = "../inventory/skill_summary.csv"
batch_id_prefix = "skill-review"
included_statuses = ["ACTIVE"]

[workspace]
# Runtime: disposable after trusted cleanup/recovery completes.
root = "../.batch-review/work"
git_download_root = "../.batch-review/git_download"
# State/control plane: batch state, indexes and AI queue. The historical
# config key remains manifest_root for compatibility.
manifest_root = "../.batch-review/manifests"
# Archive + durable results / restricted audit evidence.
skills_root = "../.batch-review/skills"
evidence_root = "../.batch-review/restricted-evidence"
# Controlled publication staging; not the audit evidence store.
candidate_root = "../.batch-review/private-candidates"
# Reports: the only human entry is results/<batch-id>/skill-security-review-report.html.
results_root = "../.batch-review/results"
clean_after_repository = true
keep_failed_workspace = false

[gerrit]
ssh_url_template = "ssh://{user}@{host}:{port}/{repo_name}.git"
user = "git"
host = "gerrit.example.com"
port = 29418
allowed_repositories = []

[status_mapping]
"新增" = "ACTIVE"
"修改" = "ACTIVE"
"删除" = "DELETED"
"active" = "ACTIVE"
"inactive" = "INACTIVE"

[quality]
candidate_threshold = 70
max_score = 100

[ai]
# Canonical policy/Schema. .claude/.codex contain client adapters only.
skill_path = "../.agents/skills/skill-security-review"
result_schema_path = "../.agents/skills/skill-security-review/references/review-result.schema.json"

[scanners.cisco]
enabled = true
version = "2.0.13"
timeout_seconds = 600
command = [
  "skill-scanner", "scan", "{skill_root}",
  "--format", "json", "--compact", "--output", "{output_file}",
]

[scanners.skillspector]
enabled = true
version = "2.5.1"
timeout_seconds = 600
command = [
  "skillspector", "scan", "{skill_root}",
  "--no-llm", "--format", "json", "--output", "{output_file}",
]

[retry]
max_attempts = 3
backoff_seconds = 5
max_backoff_seconds = 60

[concurrency]
repositories = 1
skills_per_repository = 1
ai_reviews = 5
