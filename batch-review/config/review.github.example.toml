# GitHub 验证配置模板。正式切换 Gerrit 时以 review.company.example.toml 为基础。

[batch]
inventory_csv = "../inventory/github_skill_summary.csv"
batch_id_prefix = "github-validation"
included_statuses = ["ACTIVE"]

[workspace]
# Runtime
root = "../.batch-review/github-validation/work"
git_download_root = "../.batch-review/github-validation/git_download"
# State/control plane（兼容键名 manifest_root）
manifest_root = "../.batch-review/github-validation/manifests"
# Archive + restricted evidence
skills_root = "../.batch-review/github-validation/skills"
evidence_root = "../.batch-review/github-validation/restricted-evidence"
# Candidate staging
candidate_root = "../.batch-review/github-validation/private-candidates"
# Reports；唯一人工入口为 <batch-id>/skill-security-review-report.html
results_root = "../.batch-review/github-validation/results"
clean_after_repository = true
keep_failed_workspace = true

[gerrit]
ssh_url_template = "ssh://{user}@{host}:{port}/{repo_name}.git"
user = "git"
host = "ssh.github.com"
port = 443
allowed_repositories = ["Chenzy-zero/SkillHub"]
ssh_identity_file = "FILL_GITHUB_READONLY_SSH_KEY_PATH"

[status_mapping]
"新增" = "ACTIVE"
"修改" = "ACTIVE"
"删除" = "DELETED"

[quality]
candidate_threshold = 70
max_score = 100

[ai]
skill_path = "../.agents/skills/skill-security-review"
result_schema_path = "../.agents/skills/skill-security-review/references/review-result.schema.json"

[scanners.cisco]
enabled = true
version = "2.0.13"
timeout_seconds = 600
command = [
  "FILL_CISCO_EXECUTABLE", "scan", "{skill_root}",
  "--format", "json", "--compact", "--output", "{output_file}",
]

[scanners.skillspector]
enabled = true
version = "2.5.1"
timeout_seconds = 600
command = [
  "FILL_SKILLSPECTOR_EXECUTABLE", "scan", "{skill_root}",
  "--no-llm", "--format", "json", "--output", "{output_file}",
]

[retry]
max_attempts = 3
backoff_seconds = 5
max_backoff_seconds = 60

[concurrency]
repositories = 1
skills_per_repository = 1
ai_reviews = 5
