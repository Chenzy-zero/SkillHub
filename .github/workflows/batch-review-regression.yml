name: batch-review regression

on:
  push:
    paths:
      - "batch-review/**"
      - ".github/workflows/batch-review-regression.yml"
  pull_request:
    paths:
      - "batch-review/**"
      - ".github/workflows/batch-review-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: batch-review
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: batch-review/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full offline regression suite
        run: python -m pytest tests -q
